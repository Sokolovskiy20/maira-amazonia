<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1E14"/>
      <stop offset="100%" stop-color="#040C07"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="50%" stop-color="#52B77A"/>
      <stop offset="100%" stop-color="#2F7A48"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background Shield/Circle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#52B77A" stroke-width="8" stroke-opacity="0.35"/>
  
  <!-- Subtle inner ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#52B77A" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="8 8"/>
  
  <!-- Central Botanical 'M' Emblem -->
  <g transform="translate(0, 0)" filter="url(#glow)">
    <!-- Stylized Leaf Stem -->
    <path d="M256 120 C256 120 330 180 330 270 C330 340 280 380 256 400 C232 380 182 340 182 270 C182 180 256 120 256 120 Z" 
          fill="none" stroke="url(#leafGrad)" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Central Vein -->
    <line x1="256" y1="140" x2="256" y2="380" stroke="#52B77A" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6"/>
    
    <!-- Elegant Serif M -->
    <path d="M140 370 L140 190 L256 310 L372 190 L372 370" 
          fill="none" stroke="#ECF8F1" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Delicate Gold/Mint Accent Dots -->
    <circle cx="256" cy="310" r="7" fill="#52B77A"/>
    <circle cx="140" cy="190" r="6" fill="#ECF8F1"/>
    <circle cx="372" cy="190" r="6" fill="#ECF8F1"/>
  </g>
</svg>
